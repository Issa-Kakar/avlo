# The py-build toolchain as a real package: `avlo-build` (src/avlo_py_build/)
# is the one CLI for pack / verify / compress / budgets / stage / publish.
# Locked by the repo-root uv.lock (workspace member).
[project]
name = "avlo-py-build"
version = "0"
description = "AVLO Python toolchain: forked-Pyodide artifact pack/verify/stage/publish pipeline (the avlo-build CLI)"
# Hard pin, not a floor: pack-time pycs must carry the wasm interpreter's
# magic, so the host minor MUST equal toolchain.python's (build.config.json).
# The pack commands re-assert this at runtime.
requires-python = "==3.14.*"
dependencies = [
  "pydantic>=2.12",
  "httpx>=0.28",
  "brotli>=1.1",
  # Determinism boundary: the mpl DejaVu subset runs fontTools at EXACTLY the
  # build.config.json `hostTools.fonttools` pin — this dependency must stay
  # `==` that pin (avlo-build config check + pack-time assert both enforce it).
  # The pin (not the installer) fixes the subset bytes; uv.lock carries it.
  "fonttools==4.62.1",
]

[project.scripts]
avlo-build = "avlo_py_build.cli:main"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.3",
    "pytest-pyodide==0.59.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
