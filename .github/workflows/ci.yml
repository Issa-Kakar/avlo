name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsgo)
        run: pnpm typecheck

      - name: Typecheck (tsc ground truth)
        run: pnpm typecheck:tsc

      - name: Biome check
        run: pnpm check

      - name: Build web
        run: pnpm build

      - name: Verify SW bundle has no server symbols
        # `@avlo/api-client` re-exports server AppTypes as type-only imports
        # which Vite must erase. If a runtime import of @avlo/worker-shared
        # (or another server-only module) slips into the SW graph, the bundle
        # bloats and these symbols appear. This is the load-bearing check.
        run: |
          if grep -E 'partyserverMiddleware|HTMLRewriter|R2Bucket|isPrivateHost' web/dist/sw.js > /dev/null; then
            echo "ERROR: SW bundle contains server-only symbols"
            grep -E 'partyserverMiddleware|HTMLRewriter|R2Bucket|isPrivateHost' web/dist/sw.js
            exit 1
          fi

      - name: Verify AI server symbols stay out of the client bundle
        # The web client must import only agents/react + @cloudflare/ai-chat/react
        # (the AiPanel lazy chunk). Server entries (AIChatAgent, routeAgentRequest)
        # in ANY client chunk mean a server import leaked into the browser graph.
        run: |
          if grep -lE 'AIChatAgent|routeAgentRequest' web/dist/assets/*.js web/dist/sw.js > /dev/null 2>&1; then
            echo "ERROR: client bundle contains agents server-entry symbols"
            grep -lE 'AIChatAgent|routeAgentRequest' web/dist/assets/*.js web/dist/sw.js
            exit 1
          fi
